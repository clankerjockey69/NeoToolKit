name: NeoToolkit
options:
  bundleIdPrefix: com.neothegreatnpc
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  NeoToolkit:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neothegreatnpc.NeoToolkit
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Neo Toolkit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
schemes:
  NeoToolkit:
    build:
      targets:
        NeoToolkit: all
