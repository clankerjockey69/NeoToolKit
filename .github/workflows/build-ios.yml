name: Build iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        run: >-
          xcodebuild -project NeoToolkit.xcodeproj -scheme NeoToolkit
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/NeoToolkit.app package/Payload/
          cd package
          zip -r ../NeoToolkit-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NeoToolkit-iPhone-unsigned
          path: NeoToolkit-unsigned.ipa
          if-no-files-found: error
